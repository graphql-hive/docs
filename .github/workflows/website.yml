on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

jobs:
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: build
        run: bun run build
        working-directory: packages/documentation
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: export search indexes
        run: bun run search:export
        working-directory: packages/documentation

      # TODO: add R2 lifecycle cleanup/retention for per-commit preview search indexes.
      - name: upload search index to r2
        run: |
          bunx wrangler r2 object put hive-docs-search-index/search/${SEARCH_INDEX_KEY}.json --file ./.output/search/latest.json

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            bunx wrangler r2 object put hive-docs-search-index/search/latest.json --file ./.output/search/latest.json
          fi
        working-directory: packages/documentation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEARCH_INDEX_KEY: ${{ github.sha }}

      - name: deploy to cloudflare workers
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          workingDirectory: packages/documentation
          command: |
            ${{ github.ref == 'refs/heads/main' && format('deploy --var SEARCH_INDEX_KEY:{0}', github.sha) || format('versions upload --var SEARCH_INDEX_KEY:{0}', github.sha) }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: find deployment comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        id: fc
        if: ${{ github.event.pull_request.number != '' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: <!--- deployment-previews --->

      - name: build comment body
        if: ${{ github.event.pull_request.number != '' }}
        id: comment
        env:
          EXISTING_BODY: ${{ steps.fc.outputs.comment-body }}
          WEBSITE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          STORYBOOK_URL=$(echo "$EXISTING_BODY" | grep -o 'storybook-url:[^ ]*' | head -1 | cut -d: -f2- || true)

          {
            echo "body<<ENDOFCOMMENT"
            echo "<!--- deployment-previews --->"
            echo "<!--- website-url:${WEBSITE_URL} --->"
            [ -n "$STORYBOOK_URL" ] && echo "<!--- storybook-url:${STORYBOOK_URL} --->"
            echo ""
            echo "| Deployment | URL |"
            echo "|:--|:--|"
            echo "| 🌐 Website | [${WEBSITE_URL}](${WEBSITE_URL}) |"
            [ -n "$STORYBOOK_URL" ] && echo "| 📚 Storybook | [${STORYBOOK_URL}](${STORYBOOK_URL}) |"
            echo "ENDOFCOMMENT"
          } >> "$GITHUB_OUTPUT"

      - name: create/update comment
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        if: ${{ github.event.pull_request.number != '' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.comment.outputs.body }}
          edit-mode: replace
