name: ci
on:
  push:
    branches:
      - main

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  code-style:
    uses: ./.github/workflows/lint.yml

  typescript:
    uses: ./.github/workflows/typescript-typecheck.yml

  check-seo:
    uses: ./.github/workflows/check-meta-tags.yml

  test:
    uses: ./.github/workflows/test.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  search-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: deploy search api to cloudflare workers
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          workingDirectory: packages/search-api
          command: deploy

  website:
    uses: ./.github/workflows/website.yml
    needs:
      - search-api
    with:
      environment: production
    secrets: inherit

  storybook:
    uses: ./.github/workflows/storybook.yml
    with:
      environment: storybook
    secrets: inherit

